<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Tela De Login</title>
</head>

<body>
<header class="site-header">
    <span class="site-header-titulo">Clínica Médica</span>
</header>
<div class="container text-center login-block">

    <div>
        <h2>João Gabriel de Sá Menezes</h2>
    </div>
    <div class="">
        <form th:action="@{/login}" th:object="${cliente}" method="post">
            <label for="login">Nome:</label><input
                type="text" id="login" th:field="*{login}" required placeholder="Digite seu Nome/Login">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" th:field="*{senha}" required placeholder="Digite sua Senha">
            <input type="submit" placeholder="Entrar">
            <p th:if="${ok}" th:text="${ok}" class="mensagem-cadastro"></p>
            <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>
        </form>
        <a th:href="@{/cadastrar}" class="botao-link">Criar Conta</a>
    </div>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
